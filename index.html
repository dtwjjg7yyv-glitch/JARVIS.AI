<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02090b"><title>JARVIS</title><style>html,body{margin:0;height:100%;background:#02090b;color:#b8fff5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#load{position:fixed;inset:0;display:grid;place-items:center;color:#19e6d0;letter-spacing:.15em}#err{display:none;max-width:34em;padding:24px;line-height:1.5;color:#b8fff5}#err a{color:#19e6d0}</style></head><body><div id="load">CHARGEMENT DE J.A.R.V.I.S…</div><div id="err"></div><script>
(async function(){

 const response=await fetch(original,{cache:'no-store'});

`;

 html=html.replace("hist.push({role:'model',parts:[{text:a}]});if(img)","hist.push({role:'model',parts:[{text:a}]});var saved=currentChat();if(saved){saved.history=hist;persistChats();}if(img)");

 document.open();document.write(html);document.close();
}catch(e){document.getElementById('load').style.display='none';const box=document.getElementById('err');box.style.display='block';box.textContent='JARVIS n’a pas pu démarrer : '+e.message+' Ouvre le dépôt GitHub pour réessayer.';}
