bble.bot{align-self:flex-start;background:#ffffff0b;border:1px solid #b8fff522}.bubble img{display:block;max-width:min(220px,100%);border-radius:10px;margin-bottom:6px}.composer{display:flex;gap:7px;padding:10px;border-top:1px solid var(--line);align-items:center}.composer input[type=text]{min-width:0;flex:1}.composer button{flex:none;padding:10px}.composer button[aria-pressed=true]{background:#19e6d044}.empty{margin:auto;color:var(--mut);text-align:center;padding:24px}.menu{position:fixed;z-index:30;top:0;bottom:0;right:0;width:min(330px,88vw);padding:calc(20px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:#041214;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:7px}.menu .brand{color:var(--tq);letter-spacing:.3em;margin:8px}.menu button{text-align:left}.menu button::before{content:'·';color:var(--tq);font-size:22px;line-height:10px;margin-right:10px}#scrim{position:fixed;z-index:29;inset:0;background:#0009}.todo{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.todo span{flex:1}.todo.done span{text-decoration:line-through;color:var(--mut)}.checkline{display:flex;align-items:center;gap:8px}.checkline input{width:auto}.picPreview{max-width:100px;border-radius:10px}.brief{white-space:pre-wrap;line-height:1.55}.statusText{min-height:1.3em;color:var(--mut);font-size:13px}.danger{border-color:#b85b5b;color:#ffcaca}.chatItem.selected .chatPick{border-color:var(--tq);background:#19e6d01e}@media(max-width:650px){header{height:64px}.chatLayout{display:flex;flex-direction:column;min-height:calc(100dvh - 120px)}#chatList{max-height:155px;flex:none}.chatItem{display:inline-flex;width:88%;vertical-align:middle}#chatList h2{display:inline-block;margin-right:10px}#chatPane{min-height:50dvh}.pageHead{margin-top:8px}.homeActions{bottom:14px}.composer{flex-wrap:wrap}.composer input[type=text]{flex-basis:45%}}@media(min-width:950px){#burger{di (function(){'use strict';

function goHome(){home.hidden=false;page.hidden=true;closeMenu();status.textContent='Touche la sphère pour discuter';}function closeMenu(){menu.hidden=true;scrim.hidden=true;}function openMenu(){menu.hidden=false;scrim.hidden=false;}
function openPage(key){if(!labels[key])return;closeMenu();home.hidden=true;page.hidden=false;page.innerHTML='';const head=document.createElement('div');head.className='pageHead';const text=document.createElement('div'),h=document.createElement('h1'),p=document.createElement('p');h.textContent=labels[key][0];p.textContent=labels[key][1];text.append(h,p);const back=document.createElement('button');back.className='homeLink';back.textContent='⌂ Accueil';back.onclick=goHome;head.append(text,back);page.append(head);const content=document.createElement('div');content.className='pageContent';page.append(content);status.textContent=labels[key][0];if(key==='discussion')renderDiscussions(content);else if(key==='parametres')renderSettings(content);else if(key==='rappels')renderTodos(content);else if(key==='memoire')renderMemory(content);else if(key==='aujourdhui')renderToday(content);else if(key==='crypto')renderCrypto(content);else{const c=document.createElement('div');c.className='card';c.innerHTML='<p class="muted"></p>';c.querySelector('p').textContent=labels[key][1];content.append(c);}}
$('#homeBtn').onclick=goHome;$('#burger').onclick=openMenu;scrim.onclick=closeMenu;$('#openChat').onclick=()=>openPage('discussion');$('#openSettings').onclick=()=>openPage('parametres');menu.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
[['discussion','Discussions'],['aujourdhui','Aujourd’hui'],['rappels','Rappels'],['memoire','Mémoire'],['crypto','Crypto'],['parametres','⚙️']].forEach((it,i)=>{const b=document.createElement('button');b.className='shortcut';b.textContent=it[1];b.onclick=()=>openPage(it[0]);$('#shortcuts').append(b);});
const canvas=$('#reactor'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,t=0;function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const rad=Math.min(W,H)*.34,els=$('#shortcuts').children;for(let i=0;i<els.length;i++){const a=(-90+i*60)*Math.PI/180;els[i].style.left=(W/2+Math.cos(a)*rad)+'px';els[i].style.top=(H/2+Math.sin(a)*rad)+'px';}}window.addEventListener('resize',resize);resize();function draw(){t+=.012;ctx.clearRect(0,0,W,H);const x=W/2,y=H/2,r=Math.min(W,H)*.235;const glow=ctx.createRadialGradient(x,y,5,x,y,r*1.8);glow.addColorStop(0,'#19e6d077');glow.addColorStop(1,'#19e6d000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(let n=0;n<8;n++){ctx.beginPath();for(let i=0;i<=240;i++){const a=i/240*Math.PI*2,rr=r*(1+.018*Math.sin(a*(3+n%3)+t*(.4+n*.04)+n)),px=x+Math.cos(a+t*.035)*rr,py=y+Math.sin(a+t*.035)*rr;if(!i)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.strokeStyle=`rgba(80,255,235,${.16+n*.035})`;ctx.lineWidth=n===0?2:1;ctx.stroke();}ctx.beginPath();ctx.arc(x,y,r*.16*(1+.035*Math.sin(t*2)),0,Math.PI*2);ctx.fillStyle='#cffff8';ctx.shadowColor='#19e6d0';ctx.shadowBlur=30;ctx.fill();ctx.shadowBlur=0;requestAnimationFrame(draw);}requestAnimationFrame(draw);canvas.onclick=e=>{const r=canvas.getBoundingClientRect();if(Math.hypot(e.clientX-r.left-W/2,e.clientY-r.top-H/2)<Math.min(W,H)*.3)openPage('discussion');};
const STORE='jv_conversations_v1';let conversations=[];try{conversations=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(conversations))conversations=[];}catch(e){conversations=[];}let activeId=null,busy=false;
function saveChats(){try{localStorage.setItem(STORE,JSON.stringify(conversations.slice(-40)));}catch(e){alert('Stockage local plein : supprime quelques conversations ou photos.');}}function currentChat(){return conversations.find(c=>c.id===activeId);}function newChat(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:'Nouvelle discussion',messages:[],history:[]};conversations.unshift(c);activeId=c.id;saveChats();return c;}function safeText(tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e;}
function renderDiscussions(root){if(!conversations.length)newChat();if(!currentChat())activeId=conversations[0].id;const layout=document.createElement('div');layout.className='chatLayout';const list=document.createElement('aside');list.id='chatList';const pane=document.createElement('div');pane.id='chatPane';layout.append(list,pane);root.append(layout);function paintList(){list.innerHTML='';list.append(safeText('h2','Conversations'));const add=document.createElement('button');add.textContent='+ Nouvelle';add.onclick=()=>{newChat();paintList();paintPane();};list.append(add);conversations.forEach(c=>{const row=document.createElement('div');row.className='chatItem'+(c.id===activeId?' selected':'');const pick=document.createElement('button');pick.className='chatPick';pick.textContent=c.title;pick.title=c.title;pick.onclick=()=>{activeId=c.id;paintList();paintPane();};const del=document.createElement('button');del.className='chatDelete';del.textContent='×';del.title='Supprimer cette discussion';del.setAttribute('aria-label','Supprimer '+c.title);del.onclick=()=>{if(!confirm('Supprimer cette discussion ?'))return;conversations=conversations.filter(x=>x.id!==c.id);if(!conversations.length)newChat();else if(activeId===c.id)activeId=conversations[0].id;saveChats();paintList();paintPane();};row.append(pick,del);list.append(row);});}
function paintPane(){const c=currentChat();pane.innerHTML='';pane.append(safeText('div',c.title,'chatTitle'));const msgs=document.createElement('div');msgs.className='messages';if(!c.messages.length)msgs.append(safeText('p','Écris à JARVIS pour commencer.','empty'));c.messages.forEach(m=>{const b=safeText('div',m.text,'bubble '+(m.role==='user'?'user':'bot'));if(m.image){const im=document.createElement('img');im.src=m.image;im.alt='Photo envoyée';b.prepend(im);}msgs.append(b);});const form=document.createElement('form');form.className='composer';const input=document.createElement('input');input.type='text';input.placeholder='Écris à JARVIS…';input.autocomplete='off';input.setAttribute('aria-label','Message');const file=document.createElement('input');file.type='file';file.accept='image/*';file.hidden=true;const photo=document.createElement('button');photo.type='button';photo.textContent='📷';photo.title='Joindre une photo';photo.onclick=()=>file.click();let pendingImage=null;file.onchange=()=>{const f=file.files&&file.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,1024/Math.max(im.width,im.height)),cvs=document.createElement('canvas');cvs.width=Math.round(im.width*scale);cvs.height=Math.round(im.height*scale);cvs.getContext('2d').drawImage(im,0,0,cvs.width,cvs.height);pendingImage=cvs.toDataURL('image/jpeg',.78);photo.textContent='📷✓';};im.src=reader.result;};reader.readAsDataURL(f);file.value='';};const voice=document.createElement('button');voice.type='button';voice.textContent='🎙';voice.title='Dicter';voice.onclick=()=>startDictation(input,voice);const send=document.createElement('button');send.textContent='Envoyer';form.append(input,file,photo,voice,send);form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim()|| (pendingImage?'Que vois-tu sur cette photo ?':'');if(!text||busy)return;busy=true;const image=pendingImage;pendingImage=null;photo.textContent='📷';c.messages.push({role:'user',text,image:image||null});if(c.title==='Nouvelle discussion')c.title=text.slice(0,36)+(text.length>36?'…':'');const parts=[{text}];if(image)parts.push({inline_data:{mime_type:'image/jpeg',data:image.split(',')[1]}});c.history.push({role:'user',parts});saveChats();paintList();paintPane();await sendMessage(c);busy=false;paintList();paintPane();};pane.append(msgs,form);msgs.scrollTop=msgs.scrollHeight;}
async function sendMessage(c){let apiKey='',model='gemini-3.8-flash';try{apiKey=localStorage.getItem('jv_key')||'';model=localStorage.getItem('jv_model')||model;}catch(e){}if(!apiKey){c.messages.push({role:'model',text:'Il me manque ma clé Google AI Studio. Ouvre ⚙️ Paramètres pour la configurer.'});saveChats();return;}try{const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({systemInstruction:{parts:[{text:systemPrompt()}]},contents:c.history})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||response.status);const answer=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'Je n’ai pas pu formuler de réponse.';const clean=processAssistantTags(answer);c.history.push({role:'model',parts:[{text:clean}]});c.messages.push({role:'model',text:clean});speak(clean);}catch(e){c.history.pop();c.messages.push({role:'model',text:'Erreur : '+e.message});}if(c.history.length>30)c.history.splice(0,2);saveChats();}
function startDictation(input,button){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){input.placeholder='Dictée indisponible sur ce navigateur';return;}const rec=new SR();rec.lang='fr-FR';rec.interimResults=true;button.setAttribute('aria-pressed','true');rec.onresult=e=>{let s='';for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;input.value=s;};rec.onerror=()=>{input.placeholder='Micro bloqué ou indisponible';};rec.onend=()=>button.setAttribute('aria-pressed','false');try{rec.start();}catch(e){button.setAttribute('aria-pressed','false');}}
paintList();paintPane();}
const SYS='Tu es JARVIS, assistant personnel de l’utilisateur, inspiré d’Iron Man. Réponds en français, de manière courte, claire et chaleureuse.';function memory(){try{return JSON.parse(localStorage.getItem('jv_mem')||'[]');}catch(e){return[];}}function systemPrompt(){return SYS+' Nous sommes le '+new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.'+(memory().length?'\nInformations utiles à retenir :\n- '+memory().join('\n- '):'')+'\nSi une info durable est donnée, termine par [[MEM: courte info]]. Si une tâche ou un rappel est demandé, termine par [[TODO: tâche et moment]]. Ne mémorise jamais de secret, mot de passe ou information bancaire.';}function processAssistantTags(answer){let text=answer;const mr=/\[\[MEM:\s*([^\]]+)\]\]/g;let m,mem=memory();while((m=mr.exec(answer))){const v=m[1].trim();if(v&&v.length<200&&!mem.includes(v)&&!(/mot de passe|password|iban|\d{9,}/i.test(v)))mem.push(v);}try{localStorage.setItem('jv_mem',JSON.stringify(mem.slice(-60)));}catch(e){}const tr=/\[\[TODO:\s*([^\]]+)\]\]/g;let todos=getTodos();while((m=tr.exec(answer))){if(m[1].trim())todos.push({t:m[1].trim().slice(0,200),d:0});}saveTodos(todos);text=text.replace(/\s*\[\[(?:MEM|TODO):[^\]]*\]\]/g,'').trim();return text;}
function renderSettings(root){const grid=document.createElement('div');grid.className='settingsGrid';root.append(grid);const ai=document.createElement('section');ai.className='card';ai.innerHTML='<h2>Connexion à l’IA</h2><p class="muted">La clé reste dans le stockage local de ce navigateur et sera envoyée à Google pour les requêtes. Ne la partage pas et n’utilise pas d’appareil public.</p><div class="field"><label for="apiKey">Clé Google AI Studio</label><input id="apiKey" type="password" autocomplete="off" placeholder="Colle ta clé API"></div><div class="field"><label for="model">Modèle Gemini</label><input id="model" placeholder="gemini-3.8-flash"></div><button id="saveAI">Enregistrer</button><p class="statusText" id="saveStatus" aria-live="polite"></p>';const prefs=document.createElement('section');prefs.className='card';prefs.innerHTML='<h2>Voix</h2><label class="switchrow"><input id="voiceOn" type="checkbox"> Lire les réponses à voix haute</label><div class="field"><label for="voiceSelect">Voix française</label><select id="voiceSelect"></select></div><button id="saveVoice">Enregistrer la voix</button><p class="muted">La disponibilité des voix dépend de ton téléphone et de ton navigateur.</p>';const privacy=document.createElement('section');privacy.className='card';privacy.innerHTML='<h2>Données sur cet appareil</h2><p class="muted">Discussions, rappels et mémoire sont enregistrés localement dans ce navigateur.</p><button id="exportData">Copier une sauvegarde</button><button id="deleteChats" class="danger">Supprimer toutes les discussions</button><div class="field"><label for="pinSetting">Code PIN optionnel (4 à 6 chiffres)</label><input id="pinSetting" type="password" inputmode="numeric" maxlength="6" placeholder="Nouveau code PIN"></div><button id="savePin">Enregistrer le PIN</button> <button id="removePin">Supprimer le PIN</button><p id="settingsStatus" class="statusText"></p>';grid.append(ai,prefs,privacy);try{$('#apiKey').value=localStorage.getItem('jv_key')||'';$('#model').value=localStorage.getItem('jv_model')||'gemini-3.8-flash';$('#voiceOn').checked=localStorage.getItem('jv_von')==='1';}catch(e){}function fillVoices(){const select=$('#voiceSelect'),selected=localStorage.getItem('jv_voice')||'';select.innerHTML='';const voices=window.speechSynthesis? speechSynthesis.getVoices().filter(v=>/^fr/i.test(v.lang)):[];if(!voices.length){const o=document.createElement('option');o.textContent='Voix système par défaut';o.value='';select.append(o);}voices.forEach(v=>{const o=document.createElement('option');o.value=v.name;o.textContent=v.name;o.selected=v.name===selected;select.append(o);});}fillVoices();if(window.speechSynthesis)speechSynthesis.onvoiceschanged=fillVoices;$('#saveAI').onclick=()=>{try{localStorage.setItem('jv_key',$('#apiKey').value.trim());localStorage.setItem('jv_model',$('#model').value.trim()||'gemini-3.8-flash');$('#saveStatus').textContent='Paramètres enregistrés sur cet appareil.';}catch(e){$('#saveStatus').textContent='Enregistrement impossible.';}};$('#saveVoice').onclick=()=>{try{localStorage.setItem('jv_voice',$('#voiceSelect').value);localStorage.setItem('jv_von',$('#voiceOn').checked?'1':'0');$('#settingsStatus').textContent='Préférences vocales enregistrées.';}catch(e){}};$('#deleteChats').onclick=()=>{if(confirm('Supprimer toutes les discussions enregistrées ?')){conversations=[];activeId=null;saveChats();$('#settingsStatus').textContent='Discussions supprimées.';}};$('#exportData').onclick=async()=>{const data={conversations,mem:memory(),todos:getTodos()};try{await navigator.clipboard.writeText(JSON.stringify(data));$('#settingsStatus').textContent='Sauvegarde copiée.';}catch(e){$('#settingsStatus').textContent='Copie impossible dans ce navigateur.';}};$('#savePin').onclick=async()=>{const v=$('#pinSetting').value;if(!/^\d{4,6}$/.test(v)){alert('Le PIN doit contenir 4 à 6 chiffres.');return;}try{localStorage.setItem('jv_pin',await digestPin(v));localStorage.setItem('jv_pin_length',String(v.length));$('#pinSetting').value='';$('#settingsStatus').textContent='PIN activé. Il sera demandé au prochain chargement.';}catch(e){$('#settingsStatus').textContent='Impossible de créer le PIN : utilise une adresse HTTPS.';}};$('#removePin').onclick=()=>{localStorage.removeItem('jv_pin');localStorage.removeItem('jv_pin_length');$('#settingsStatus').textContent='PIN supprimé.';};}
function speak(text){if(!window.speechSynthesis||localStorage.getItem('jv_von')!=='1')return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';const name=localStorage.getItem('jv_voice');const v=speechSynthesis.getVoices().find(x=>x.name===name);if(v)u.voice=v;speechSynthesis.speak(u);}catch(e){}}
async function digestPin(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('jv:'+v));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
function getTodos(){try{return JSON.parse(localStorage.getItem('jv_todo')||'[]');}catch(e){return[];}}function saveTodos(a){try{localStorage.setItem('jv_todo',JSON.stringify(a.slice(-100)));}catch(e){}}
function renderTodos(root){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Mes rappels</h2><div id="todoList"></div><form class="row" id="todoForm"><input id="todoInput" placeholder="Ajouter un rappel" autocomplete="off"><button>Ajouter</button></form>';root.append(card);function paint(){const l=$('#todoList');l.innerHTML='';const a=getTodos();if(!a.length)l.append(safeText('p','Aucun rappel.','muted'));a.forEach((x,i)=>{const row=document.createElement('div');row.className='todo'+(x.d?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!x.d;cb.onchange=()=>{const z=getTodos();z[i].d=cb.checked?1:0;saveTodos(z);paint();};row.append(cb,safeText('span',x.t));const del=document.createElement('button');del.textContent='Supprimer';del.onclick=()=>{const z=getTodos();z.splice(i,1);saveTodos(z);paint();};row.append(del);l.append(row);});}$('#todoForm').onsubmit=e=>{e.preventDefault();const v=$('#todoInput').value.trim();if(!v)return;const a=getTodos();a.push({t:v.slice(0,200),d:0});saveTodos(a);$('#todoInput').value='';paint();};paint();}
function renderMemory(root){const c=document.createElement('section');c.className='card';c.innerHTML='<h2>Mémoire</h2><p class="muted">Informations enregistrées localement. Évite les secrets et données sensibles.</p><form class="row" id="memForm"><input id="memInput" placeholder="Ajouter une info à retenir"><button>Ajouter</button></form><div id="memList"></div><button id="clearMem" class="danger">Tout effacer</button>';root.append(c);function paint(){const a=memory(),l=$('#memList');l.innerHTML='';if(!a.length)l.append(safeText('p','Rien pour l’instant.','muted'));a.forEach((v,i)=>{const row=document.createElement('div');row.className='todo';row.append(safeText('span',v));const b=document.createElement('button');b.textContent='Supprimer';b.onclick=()=>{const z=memory();z.splice(i,1);localStorage.setItem('jv_mem',JSON.stringify(z));paint();};row.append(b);l.append(row);});}$('#memForm').onsubmit=e=>{e.preventDefault();const v=$('#memInput').value.trim();if(!v)return;const a=memory();a.push(v.slice(0,200));localStorage.setItem('jv_mem',JSON.stringify(a.slice(-60)));$('#memInput').value='';paint();};$('#clearMem').onclick=()=>{if(confirm('Effacer toute la mémoire ?')){localStorage.removeItem('jv_mem');paint();}};paint();}
function renderToday(root){const card=document.createElement('section');card.className='card';card.innerHTML='<h2 id="greet"></h2><h3>Météo</h3><p id="weather" class="muted">Autorise la localisation pour afficher la météo.</p><h3>Rappels non terminés</h3><div id="todayTodos"></div><button id="todayCrypto">Ouvrir le brief crypto</button>';root.append(card);const hr=new Date().getHours();$('#greet').textContent=(hr<5||hr>=18?'Bonsoir':'Bonjour')+' 👋';const pending=getTodos().filter(x=>!x.d);$('#todayTodos').textContent=pending.length?pending.map(x=>'• '+x.t).join('\n'):'Rien de prévu pour le moment.';$('#todayCrypto').onclick=()=>openPage('crypto');if(navigator.geolocation)navigator.geolocation.getCurrentPosition(async pos=>{try{const u='https://api.open-meteo.com/v1/forecast?latitude='+pos.coords.latitude+'&longitude='+pos.coords.longitude+'&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto';const r=await fetch(u),d=await r.json();$('#weather').textContent='Maintenant '+Math.round(d.current.temperature_2m)+'° · min '+Math.round(d.daily.temperature_2m_min[0])+'° / max '+Math.round(d.daily.temperature_2m_max[0])+'° · pluie '+d.daily.precipitation_probability_max[0]+' %';}catch(e){$('#weather').textContent='Météo indisponible.';}},()=>{$('#weather').textContent='Autorise la localisation pour voir la météo.';},{timeout:8000});}
async function renderCrypto(root){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Brief crypto du jour</h2><p class="muted">Données générales, pas un conseil financier.</p><button id="refreshCrypto">Actualiser le brief</button><div id="cryptoOut" class="brief muted">Chargement…</div>';root.append(card);$('#refreshCrypto').onclick=()=>loadCrypto(true);await loadCrypto(false);}
async function loadCrypto(force){const out=$('#cryptoOut');if(!out)return;const key='jv_crypto_'+new Date().toLocaleDateString('fr-CA');if(!force){try{const cached=localStorage.getItem(key);if(cached){out.textContent=cached;return;}}catch(e){}}out.textContent='JARVIS prépare le brief…';try{let prices='';try{const r=await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&order=market_cap_desc&per_page=10&page=1&price_change_percentage=24h');if(r.ok){const d=await r.json();prices=d.map(c=>c.name+' ('+c.symbol.toUpperCase()+') : '+c.current_price+' € ('+(c.price_change_percentage_24h==null?'?':c.price_change_percentage_24h.toFixed(1)+' %')+' sur 24 h)').join('\n');}}catch(e){}let headlines=[];for(const url of ['https://cryptocurrency.cv/api/news?limit=20','https://min-api.cryptocompare.com/data/v2/news/?lang=EN&sortOrder=latest']){try{const r=await fetch(url);if(!r.ok)continue;const d=await r.json(),a=d.articles||d.Data||[];headlines=a.slice(0,12).map(x=>x.title).filter(Boolean);if(headlines.length)break;}catch(e){}}const api=localStorage.getItem('jv_key');let summary='';if(api){const prompt='En français, résume brièvement ces titres crypto, indique pour chacun l’impact possible (haussier, baissier ou incertain), sans conseil d’achat/vente.\n'+(headlines.length?headlines.join('\n'):'Cherche les actualités crypto récentes si la recherche web est disponible.');const model=localStorage.getItem('jv_model')||'gemini-3.8-flash';const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':api},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],...(headlines.length?{}:{tools:[{google_search:{}}]})})});const d=await r.json();if(r.ok)summary=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('');else summary='Brief IA indisponible : '+(d.error?.message||r.status);}else summary=headlines.length?headlines.map(x=>'• '+x).join('\n'):'Actualités indisponibles. Ajoute une clé Google AI Studio dans Paramètres pour générer un brief.';const full=(prices?'Prix (top 10)\n'+prices+'\n\n':'')+summary+'\n\nInformations générales, pas un conseil financier.';out.textContent=full;try{localStorage.setItem(key,full);}catch(e){}}catch(e){out.textContent='Impossible de préparer le brief : '+e.message;}}
try{if(localStorage.getItem('jv_pin')){const overlay=document.createElement('div');overlay.style.cssText='position:fixed;inset:0;z-index:100;background:#02090b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#19e6d0';overlay.innerHTML='<strong>J.A.R.V.I.S</strong><input id="unlockPin" type="password" inputmode="numeric" placeholder="Code PIN" style="width:180px;text-align:center"><p id="pinError"></p>';document.body.append(overlay);const pin=$('#unlockPin');pin.addEventListener('input',async()=>{const n=+(localStorage.getItem('jv_pin_length')||4);if(pin.value.length>=n){try{if(await digestPin(pin.value)===localStorage.getItem('jv_pin'))overlay.remove();else $('#pinError').textContent='Code incorrect';}catch(e){$('#pinError').textContent='Impossible de vérifier le code';}pin.value='';}});}}catch(e){}
})();
