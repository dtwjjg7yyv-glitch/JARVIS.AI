<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#02090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<title>JARVIS · Réacteur</title>
<style>
:root{color-scheme:dark;--bg:#02090b;--panel:#071416;--tq:#19e6d0;--pale:#b8fff5;--mut:#739b98;--line:rgba(25,230,208,.23);font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--pale)}body{display:flex;flex-direction:column;overflow:hidden}button,input,select{font:inherit;color:inherit}button{border:1px solid var(--line);background:rgba(25,230,208,.07);border-radius:13px;padding:11px 14px;cursor:pointer}button:hover,button.active{background:rgba(25,230,208,.18);border-color:var(--tq)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--pale);outline-offset:2px}header{height:68px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;padding:env(safe-area-inset-top) 60px 0;letter-spacing:.3em;color:var(--tq);text-shadow:0 0 12px #19e6d077}#homeBtn,#burger{position:absolute;top:10px;width:44px;height:44px;padding:0;letter-spacing:0;font-size:20px}#homeBtn{left:12px}#burger{right:12px}#status{position:absolute;top:45px;font-size:12px;letter-spacing:.04em;color:var(--mut);text-shadow:none}main{flex:1;min-height:0;position:relative}#home,#page{position:absolute;inset:0;overflow:auto}#home[hidden],#page[hidden],#scrim[hidden],#menu[hidden]{display:none}#reactor{width:100%;height:100%;position:absolute;inset:0}#shortcuts{position:absolute;inset:0;pointer-events:none}.shortcut{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border-radius:22px;padding:9px 13px;font-size:13px;white-space:nowrap;box-shadow:0 0 14px #19e6d033}.homeActions{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px}.homeActions button{white-space:nowrap}.pageHead{max-width:900px;margin:12px auto 22px;padding:0 18px;display:flex;gap:12px;align-items:center}.pageHead h1{font-size:22px;font-weight:400;color:var(--tq);margin:0}.pageHead p{color:var(--mut);margin:5px 0 0;font-size:14px}.pageContent{max-width:900px;margin:auto;padding:0 18px 34px}.homeLink{margin-left:auto}.card{background:linear-gradient(145deg,rgba(25,230,208,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.card h2,.card h3{margin:0 0 12px;color:var(--tq);font-weight:400}.muted{color:var(--mut);line-height:1.5}.field{display:flex;flex-direction:column;gap:7px;margin:12px 0}.field label{font-size:14px;color:var(--mut)}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#041214;padding:12px;font-size:16px;color:var(--pale)}input::placeholder{color:#648582}.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}.settingsGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:4px}.switchrow{display:flex;align-items:center;gap:10px;margin:12px 0}.switchrow input{width:auto}.chatLayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:14px;min-height:calc(100dvh - 132px)}#chatList{border:1px solid var(--line);border-radius:16px;padding:10px;overflow:auto;max-height:calc(100dvh - 135px)}#chatList h2{color:var(--tq);font-size:15px;font-weight:400;margin:4px 8px 10px}.chatItem{display:flex;align-items:center;gap:4px;margin:5px 0}.chatPick{flex:1;min-width:0;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:10px;font-size:13px}.chatDelete{padding:8px 10px;color:var(--mut)}#chatPane{min-width:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:60dvh}#chatTitle{padding:12px 15px;border-bottom:1px solid var(--line);color:var(--tq);font-size:14px}.messages{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:14px}.bubble{max-width:86%;padding:10px 13px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.45}.bubble.user{align-self:flex-end;background:#19e6d022;border:1px solid #19e6d066}.bubble.bot{align-self:flex-start;background:#ffffff0b;border:1px solid #b8fff522}.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}.composer input{min-width:0}.composer button{flex:none}.empty{margin:auto;color:var(--mut);text-align:center;padding:24px}.menu{position:fixed;z-index:30;top:0;bottom:0;right:0;width:min(330px,88vw);padding:calc(20px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));background:#041214;border-left:1px solid var(--line);overflow:auto;display:flex;flex-direction:column;gap:7px}.menu .brand{color:var(--tq);letter-spacing:.3em;margin:8px}.menu button{text-align:left}.menu button::before{content:'·';color:var(--tq);font-size:22px;line-height:10px;margin-right:10px}#scrim{position:fixed;z-index:29;inset:0;background:#0009}.todo{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:7px 0}.todo span{flex:1}.todo.done span{text-decoration:line-through;color:var(--mut)}@media(max-width:650px){header{height:64px}.chatLayout{display:flex;flex-direction:column;min-height:calc(100dvh - 120px)}#chatList{max-height:155px;flex:none}.chatItem{display:inline-flex;width:88%;vertical-align:middle}#chatList h2{display:inline-block;margin-right:10px}#chatPane{min-height:50dvh}.pageHead{margin-top:8px}.homeActions{bottom:14px}}@media(min-width:950px){#burger{display:none}.menu{left:0;right:auto;width:250px}body{padding-left:250px}header{justify-content:center}}
</style>
</head>
<body>
<header><button id="homeBtn" aria-label="Retour à l’accueil" title="Accueil">⌂</button>J.A.R.V.I.S<span id="status">Touche la sphère pour discuter</span><button id="burger" aria-label="Ouvrir le menu">☰</button></header>
<main>
<section id="home"><canvas id="reactor" aria-label="Sphère de JARVIS"></canvas><div id="shortcuts"></div><div class="homeActions"><button id="openChat">☷ Discussions</button><button id="openSettings" aria-label="Ouvrir les paramètres" title="Paramètres">⚙️</button></div></section>
<section id="page" hidden></section>
</main>
<div id="scrim" hidden></div><aside id="menu" class="menu" hidden><div class="brand">J.A.R.V.I.S</div><button data-page="discussion">Discussions</button><button data-page="aujourdhui">Aujourd’hui</button><button data-page="rappels">Rappels</button><button data-page="memoire">Mémoire</button><button data-page="mail">Mail</button><button data-page="paiement">Paiement</button><button data-page="crypto">Crypto</button><button data-page="commandes">Commandes</button><button data-page="systeme">Système</button><button data-page="parametres">⚙️ Paramètres</button></aside>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s),home=$('#home'),page=$('#page'),menu=$('#menu'),scrim=$('#scrim'),status=$('#status');
const labels={discussion:['Discussions','Crée plusieurs conversations et retrouve-les ici.'],aujourdhui:['Aujourd’hui','Ton aperçu du jour.'],rappels:['Rappels','Tes tâches enregistrées sur cet appareil.'],memoire:['Mémoire','Informations enregistrées localement.'],mail:['Mail','Prévu en V4.'],paiement:['Paiement','Prévu en V5.'],crypto:['Crypto','Informations générales, pas un conseil financier.'],commandes:['Commandes','Prévu en V6.'],systeme:['Système','État de JARVIS et de ses connexions.'],parametres:['Paramètres','Configure l’assistant et l’apparence de ta discussion.']};
function goHome(){home.hidden=false;page.hidden=true;closeMenu();status.textContent='Touche la sphère pour discuter';}
function closeMenu(){menu.hidden=true;scrim.hidden=true;}
function openMenu(){menu.hidden=false;scrim.hidden=false;}
function openPage(key){if(!labels[key])return;closeMenu();home.hidden=true;page.hidden=false;page.innerHTML='';const head=document.createElement('div');head.className='pageHead';const text=document.createElement('div');const h=document.createElement('h1');h.textContent=labels[key][0];const p=document.createElement('p');p.textContent=labels[key][1];text.append(h,p);const back=document.createElement('button');back.className='homeLink';back.textContent='⌂ Accueil';back.onclick=goHome;head.append(text,back);page.append(head);const content=document.createElement('div');content.className='pageContent';page.append(content);status.textContent=labels[key][0];if(key==='discussion')renderDiscussions(content);else if(key==='parametres')renderSettings(content);else if(key==='rappels')renderTodos(content);else if(key==='memoire')renderMemory(content);else if(key==='aujourdhui'){const c=document.createElement('div');c.className='card';c.innerHTML='<h2>Bonjour 👋</h2><p class="muted">Tes rappels et modules sont accessibles depuis le menu principal.</p>';content.append(c);}else{const c=document.createElement('div');c.className='card';c.innerHTML='<p class="muted"></p>';c.querySelector('p').textContent=labels[key][1];content.append(c);}}
$('#homeBtn').onclick=goHome;$('#burger').onclick=openMenu;scrim.onclick=closeMenu;$('#openChat').onclick=()=>openPage('discussion');$('#openSettings').onclick=()=>openPage('parametres');menu.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(b.dataset.page));
const shortcutItems=[['discussion','Discussions'],['aujourdhui','Aujourd’hui'],['rappels','Rappels'],['memoire','Mémoire'],['crypto','Crypto'],['parametres','⚙️']];
shortcutItems.forEach((it,i)=>{const b=document.createElement('button');b.className='shortcut';b.textContent=it[1];b.onclick=()=>openPage(it[0]);$('#shortcuts').append(b);});
const canvas=$('#reactor'),ctx=canvas.getContext('2d');let W=0,H=0,dpr=1,t=0;function resize(){const r=canvas.getBoundingClientRect();W=r.width;H=r.height;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const rad=Math.min(W,H)*.34,els=$('#shortcuts').children;for(let i=0;i<els.length;i++){const a=(-90+i*60)*Math.PI/180;els[i].style.left=(W/2+Math.cos(a)*rad)+'px';els[i].style.top=(H/2+Math.sin(a)*rad)+'px';}}window.addEventListener('resize',resize);resize();function draw(){t+=.012;ctx.clearRect(0,0,W,H);const x=W/2,y=H/2,r=Math.min(W,H)*.235;const glow=ctx.createRadialGradient(x,y,5,x,y,r*1.8);glow.addColorStop(0,'#19e6d077');glow.addColorStop(1,'#19e6d000');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);for(let n=0;n<8;n++){ctx.beginPath();for(let i=0;i<=240;i++){const a=i/240*Math.PI*2;const rr=r*(1+.018*Math.sin(a*(3+n%3)+t*(.4+n*.04)+n));const px=x+Math.cos(a+t*.035)*rr,py=y+Math.sin(a+t*.035)*rr;if(!i)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.strokeStyle=`rgba(80,255,235,${.16+n*.035})`;ctx.lineWidth=n===0?2:1;ctx.stroke();}ctx.beginPath();ctx.arc(x,y,r*.16*(1+.035*Math.sin(t*2)),0,Math.PI*2);ctx.fillStyle='#cffff8';ctx.shadowColor='#19e6d0';ctx.shadowBlur=30;ctx.fill();ctx.shadowBlur=0;requestAnimationFrame(draw);}requestAnimationFrame(draw);canvas.onclick=e=>{const r=canvas.getBoundingClientRect();if(Math.hypot(e.clientX-r.left-W/2,e.clientY-r.top-H/2)<Math.min(W,H)*.3)openPage('discussion');};
const STORE='jv_conversations_v1';let conversations=[];try{conversations=JSON.parse(localStorage.getItem(STORE)||'[]');if(!Array.isArray(conversations))conversations=[];}catch(e){conversations=[];}let activeId=null,busy=false;
function saveChats(){try{localStorage.setItem(STORE,JSON.stringify(conversations.slice(-50)));}catch(e){alert('Stockage local plein : supprime quelques conversations.');}}
function currentChat(){return conversations.find(c=>c.id===activeId);}
function newChat(){const c={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),title:'Nouvelle discussion',messages:[],history:[]};conversations.unshift(c);activeId=c.id;saveChats();return c;}
function safeText(tag,text,cls){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=text;return e;}
function renderDiscussions(root){if(!conversations.length)newChat();if(!currentChat())activeId=conversations[0].id;const layout=document.createElement('div');layout.className='chatLayout';const list=document.createElement('aside');list.id='chatList';const pane=document.createElement('div');pane.id='chatPane';layout.append(list,pane);root.append(layout);function paintList(){list.innerHTML='';const title=safeText('h2','Conversations');list.append(title);const add=document.createElement('button');add.textContent='+ Nouvelle';add.onclick=()=>{newChat();paintList();paintPane();};list.append(add);conversations.forEach(c=>{const row=document.createElement('div');row.className='chatItem';const pick=document.createElement('button');pick.className='chatPick'+(c.id===activeId?' active':'');pick.textContent=c.title;pick.title=c.title;pick.onclick=()=>{activeId=c.id;paintList();paintPane();};const del=document.createElement('button');del.className='chatDelete';del.textContent='×';del.title='Supprimer cette discussion';del.setAttribute('aria-label','Supprimer '+c.title);del.onclick=()=>{if(!confirm('Supprimer cette discussion ?'))return;conversations=conversations.filter(x=>x.id!==c.id);if(!conversations.length)newChat();else if(activeId===c.id)activeId=conversations[0].id;saveChats();paintList();paintPane();};row.append(pick,del);list.append(row);});}
function paintPane(){const c=currentChat();pane.innerHTML='';const title=safeText('div',c.title);title.id='chatTitle';pane.append(title);const msgs=document.createElement('div');msgs.className='messages';if(!c.messages.length)msgs.append(safeText('p','Écris à JARVIS pour commencer cette discussion.','empty'));c.messages.forEach(m=>msgs.append(safeText('div',m.text,'bubble '+(m.role==='user'?'user':'bot'))));const form=document.createElement('form');form.className='composer';const input=document.createElement('input');input.placeholder='Écris à JARVIS…';input.autocomplete='off';input.setAttribute('aria-label','Message');const send=document.createElement('button');send.textContent='Envoyer';form.append(input,send);form.onsubmit=async e=>{e.preventDefault();const text=input.value.trim();if(!text||busy)return;busy=true;input.value='';c.messages.push({role:'user',text});if(c.title==='Nouvelle discussion')c.title=text.slice(0,36)+(text.length>36?'…':'');c.history.push({role:'user',parts:[{text}]});saveChats();paintList();paintPane();await sendMessage(c, msgs);busy=false;paintList();paintPane();};pane.append(msgs,form);msgs.scrollTop=msgs.scrollHeight;}
async function sendMessage(c){let apiKey='';try{apiKey=localStorage.getItem('jv_key')||'';}catch(e){}if(!apiKey){c.messages.push({role:'model',text:'Il me manque ma clé Google AI Studio. Ouvre ⚙️ Paramètres pour la configurer.'});saveChats();return;}try{const model=localStorage.getItem('jv_model')||'gemini-3.8-flash';const response=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':apiKey},body:JSON.stringify({systemInstruction:{parts:[{text:'Tu es JARVIS, assistant personnel. Réponds en français, clairement et chaleureusement.'}]},contents:c.history})});const data=await response.json();if(!response.ok)throw new Error(data.error?.message||response.status);const answer=(data.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('')||'Je n’ai pas pu formuler de réponse.';c.history.push({role:'model',parts:[{text:answer}]});c.messages.push({role:'model',text:answer});}catch(e){c.history.pop();c.messages.push({role:'model',text:'Erreur : '+e.message});}saveChats();}
paintList();paintPane();}
function renderSettings(root){const grid=document.createElement('div');grid.className='settingsGrid';root.append(grid);const ai=document.createElement('section');ai.className='card';ai.innerHTML='<h2>Connexion à l’IA</h2><p class="muted">Ta clé est enregistrée dans le stockage local de ce navigateur. Ne la partage pas.</p><div class="field"><label for="apiKey">Clé Google AI Studio</label><input id="apiKey" type="password" autocomplete="off" placeholder="Colle ta clé API"></div><div class="field"><label for="model">Modèle</label><input id="model" placeholder="gemini-3.8-flash"></div><button id="saveAI">Enregistrer</button><p class="muted" id="saveStatus" aria-live="polite"></p>';const app=document.createElement('section');app.className='card';app.innerHTML='<h2>Préférences</h2><label class="switchrow"><input id="voiceOn" type="checkbox"> Activer la lecture vocale (bientôt)</label><p class="muted">Les conversations sont conservées sur cet appareil. Tu peux les supprimer depuis leur liste.</p><button id="deleteChats">Supprimer toutes les discussions</button>';grid.append(ai,app);try{$('#apiKey').value=localStorage.getItem('jv_key')||'';$('#model').value=localStorage.getItem('jv_model')||'gemini-3.8-flash';}catch(e){}$('#saveAI').onclick=()=>{try{localStorage.setItem('jv_key',$('#apiKey').value.trim());localStorage.setItem('jv_model',$('#model').value.trim()||'gemini-3.8-flash');$('#saveStatus').textContent='Param��tres enregistrés sur cet appareil.';}catch(e){$('#saveStatus').textContent='Enregistrement impossible.';}};$('#deleteChats').onclick=()=>{if(confirm('Supprimer toutes les discussions enregistrées ?')){conversations=[];activeId=null;saveChats();$('#saveStatus').textContent='Discussions supprimées.';}};}
function todos(){try{return JSON.parse(localStorage.getItem('jv_todo')||'[]');}catch(e){return[];}}function saveTodos(a){try{localStorage.setItem('jv_todo',JSON.stringify(a));}catch(e){}}
function renderTodos(root){const card=document.createElement('section');card.className='card';card.innerHTML='<h2>Mes rappels</h2><div id="todoList"></div><form class="row" id="todoForm"><input id="todoInput" placeholder="Ajouter un rappel" autocomplete="off"><button>Ajouter</button></form>';root.append(card);function paint(){const l=$('#todoList');l.innerHTML='';const a=todos();if(!a.length)l.append(safeText('p','Aucun rappel.','muted'));a.forEach((x,i)=>{const row=document.createElement('div');row.className='todo'+(x.d?' done':'');const cb=document.createElement('input');cb.type='checkbox';cb.checked=!!x.d;cb.style.width='auto';cb.onchange=()=>{const z=todos();z[i].d=cb.checked?1:0;saveTodos(z);paint();};row.append(cb,safeText('span',x.t));const del=document.createElement('button');del.textContent='Supprimer';del.onclick=()=>{const z=todos();z.splice(i,1);saveTodos(z);paint();};row.append(del);l.append(row);});}$('#todoForm').onsubmit=e=>{e.preventDefault();const v=$('#todoInput').value.trim();if(!v)return;const a=todos();a.push({t:v.slice(0,200),d:0});saveTodos(a);$('#todoInput').value='';paint();};paint();}
function renderMemory(root){const c=document.createElement('section');c.className='card';c.innerHTML='<h2>Mémoire</h2><p class="muted">Les informations sont enregistrées localement sur cet appareil.</p><form class="row" id="memForm"><input id="memInput" placeholder="Ajouter une info à retenir"><button>Ajouter</button></form><div id="memList"></div><button id="clearMem">Tout effacer</button>';root.append(c);function paint(){let a=[];try{a=JSON.parse(localStorage.getItem('jv_mem')||'[]');}catch(e){}const l=$('#memList');l.innerHTML='';a.forEach((v,i)=>{const row=document.createElement('div');row.className='todo';row.append(safeText('span',v));const b=document.createElement('button');b.textContent='Supprimer';b.onclick=()=>{a.splice(i,1);localStorage.setItem('jv_mem',JSON.stringify(a));paint();};row.append(b);l.append(row);});}$('#memForm').onsubmit=e=>{e.preventDefault();const v=$('#memInput').value.trim();if(!v)return;let a=[];try{a=JSON.parse(localStorage.getItem('jv_mem')||'[]');}catch(e){}a.push(v.slice(0,200));localStorage.setItem('jv_mem',JSON.stringify(a.slice(-60)));$('#memInput').value='';paint();};$('#clearMem').onclick=()=>{if(confirm('Effacer toute la mémoire ?')){localStorage.removeItem('jv_mem');paint();}};paint();}
})();
</script>
</body>
</html>
