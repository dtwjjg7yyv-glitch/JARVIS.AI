<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS"><link rel="apple-touch-icon" sizes="180x180" href="icon.svg?v=3"><link rel="icon" type="image/svg+xml" href="icon.svg?v=3"><title>JARVIS</title><style>html,body{margin:0;min-height:100%;background:#02090b;color:#b8fff5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#19e6d0;letter-spacing:.1em}</style></head><body><div id="status">CHARGEMENT DE J.A.R.V.I.S…</div><script>
(async function(){
 'use strict';
 try{
  var response=await fetch('https://raw.githubusercontent.com/dtwjjg7yyv-glitch/JARVIS.AI/1ab51b615896e58a15fb5703d0a051cbd6aa1c2d/index.html',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  var page=await response.text();
  var marker='let html=await response.text();';
  if(!page.includes(marker))throw new Error('La page JARVIS source a changé de format.');
  var iconLinks='<link rel="apple-touch-icon" sizes="180x180" href="icon.svg?v=3"><link rel="icon" type="image/svg+xml" href="icon.svg?v=3"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="JARVIS">';
  page=page.replace(marker,marker+'\n html=html.replace(\'</head>\',\''+iconLinks+'\</head>\');');
  document.open();document.write(page);document.close();
 }catch(error){var status=document.getElementById('status');status.style.letterSpacing='0';status.textContent='Impossible de charger JARVIS. Vérifie ta connexion puis actualise la page.';}
})();
</script></body></html>
