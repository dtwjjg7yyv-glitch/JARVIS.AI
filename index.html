<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#02090b"><title>JARVIS</title><style>html,body{margin:0;min-height:100%;background:#02090b;color:#b8fff5;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}#status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#19e6d0;letter-spacing:.1em}</style></head><body><div id="status">RESTAURATION DE J.A.R.V.I.S…</div><script>
(async function(){
 'use strict';
 try{
  var response=await fetch('https://raw.githubusercontent.com/dtwjjg7yyv-glitch/JARVIS.AI/1ab51b615896e58a15fb5703d0a051cbd6aa1c2d/index.html',{cache:'no-store'});
  if(!response.ok)throw new Error('HTTP '+response.status);
  var previous=await response.text();
  if(!previous.includes('function renderSavedChat()')||!previous.includes('id="homeback"'))throw new Error('La version précédente est incomplète.');
  document.open();document.write(previous);document.close();
 }catch(e){var s=document.getElementById('status');s.style.letterSpacing='0';s.textContent='Impossible de restaurer JARVIS. Vérifie ta connexion puis actualise la page.';}
})();
</script></body></html>
